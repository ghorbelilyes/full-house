server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  if ($host = fullhouse.com.tn) {
    return 301 https://www.fullhouse.com.tn$request_uri;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;

    # ── CORS: allow the browser origin to call API endpoints ──
    # $http_origin is the Origin header sent by the browser.
    # For a same-host setup this is usually the same domain, but
    # mismatched homeUrl / STORE_URL can trigger cross-origin requests.
    add_header Access-Control-Allow-Origin  $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle preflight OPTIONS requests
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $http_origin;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Max-Age 86400;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
  }
}
